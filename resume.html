<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume • Sam Nguyen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<style>
  @font-face {
    font-family: 'Azeret Mono';
    src: url('fonts/AzeretMono-400.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Azeret Mono';
    src: url('fonts/AzeretMono-500.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Azeret Mono';
    src: url('fonts/AzeretMono-600.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Azeret Mono';
    src: url('fonts/AzeretMono-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  /* All colors come from theme.js as CSS variables:
     --bg --ink --ink-soft --accent --accent-tint --line --surface --hover-tint
     --flame --flame-vertical --accent-fade --accent-fade-vertical
     To change a color, edit the PALETTE in theme.js, not this file. */
  :root {
    --content-max: 620px;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Bitter';
    font-size: 19px;
    line-height: 1.72;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: var(--ink);
  }

  a:hover {
    color: var(--accent);
  }

  canvas#wave {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }

  .content {
    position: relative;
    z-index: 1;
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 64px 24px 90px;
  }

  /* Top row */

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .name {
    font-family: 'Azeret Mono';
    font-size: clamp(22px, 5vw, 30px);
    font-style: normal;
    font-weight: 600;
    line-height: 1;
    color: var(--ink);
    margin-left: -16px;
    position: relative;
    top: 2px;
  }

  .home {
    font-family: 'Bitter';
    font-size: 16px;
    font-weight: 300;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 6px;
  }

  .home:hover {
    color: var(--accent);
  }

  .page-title {
    font-family: 'Bitter';
    font-size: clamp(2rem, 8vw, 2.6rem);
    line-height: 1.15;
    font-weight: 600;
    margin: 0 0 40px 0;
    text-align: center;
  }

  section {
    margin: 0 0 56px 0;
    position: relative;
  }

  /* PDF viewer */

  .pdf-actions {
    display: flex;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .pdf-actions a {
    font-family: 'Azeret Mono';
    font-size: 14.5px;
    letter-spacing: 0.02em;
    text-decoration: none;
    text-transform: uppercase;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 22px;
    color: var(--ink);
    transition:
      border-color 0.25s ease,
      color 0.25s ease,
      background 0.25s ease;
  }

  .pdf-actions a:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-tint);
  }

  .resume-img {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  footer {
    font-size: 13.5px;
    color: var(--ink-soft);
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  @media (max-width: 600px) {
    body {
      font-size: 17px;
    }

    .content {
      padding: 48px 20px 70px;
    }

    .name {
      font-size: 24px;
    }

    .home {
      font-size: 15px;
    }

    .pdf-actions a {
      font-size: 13px;
      padding: 9px 18px;
    }

    footer {
      font-size: 12.5px;
    }
  }
</style>
</head>

<body>

<canvas id="wave"></canvas>

<div class="content">

  <div class="top-row">
    <div class="name">SamsungN</div>
    <a class="home" href="index.html">HOME</a>
  </div>

  <h1 class="page-title">Resume</h1>

  <section id="pdf-viewer">
    <div class="pdf-actions">
      <a href="Sam_Nguyen_Resume.pdf" target="_blank" rel="noopener">Open</a>
      <a href="Sam_Nguyen_Resume.pdf" download>Download</a>
    </div>

    <img class="resume-img" src="images/Sam_Nguyen_Resume.png" alt="Sam Nguyen resume">
  </section>

  <footer>
    Sam Nguyen — Mechanical Engineering, Iowa State University
  </footer>

</div>

<script src="sin-wave.js"></script>
<script src="bg-trout.js"></script>

</body>
</html>
